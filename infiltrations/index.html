<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EFE9" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Infiltrations" />
  <title>Guide d'Infiltrations — COCHIN·OS</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F2EFE9;
      --bg-panel: #FAF8F4;
      --bg-well: #E6E1D6;
      --bg-elevated: #FFFFFF;
      --ink: #11151C;
      --ink-soft: #3D4552;
      --ink-muted: #707987;
      --line: #D4CEC2;
      --accent: #FF4D2D;
      --xray: #0284C7;
      --xray-soft: rgba(2, 132, 199, 0.12);
      --shadow-key: 0 2px 0 #C7C0B2;
      --shadow-card: 0 3px 0 #D4CEC2;
    }

    html.negatoscope {
      --bg: #070B10;
      --bg-panel: #0F1620;
      --bg-well: #16202E;
      --bg-elevated: #131C28;
      --ink: #ECF3F9;
      --ink-soft: #B2C3D4;
      --ink-muted: #687D94;
      --line: #1E2C3C;
      --accent: #FF5A36;
      --xray: #38BDF8;
      --xray-soft: rgba(56, 189, 248, 0.15);
      --shadow-key: 0 2px 0 #030508;
      --shadow-card: 0 3px 0 #05080D;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 32px);
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      background: var(--bg-panel);
      border: 1.5px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow-key);
    }

    /* STICKY REGION PILLS + SEARCH */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--bg);
      padding: 6px 0 8px;
      margin-bottom: 12px;
      border-bottom: 1.5px solid var(--line);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 12px;
      background: var(--bg-elevated);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      outline: none;
    }
    html.negatoscope .search-input {
      border-color: var(--line);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: var(--bg-well);
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear.visible {
      display: inline-flex;
    }

    .cat-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .cat-strip::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--bg-panel);
      color: var(--ink-soft);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: var(--shadow-key);
      flex-shrink: 0;
    }
    .cat-pill.active {
      background: var(--ink);
      color: var(--bg-panel);
      border-color: var(--ink);
    }
    html.negatoscope .cat-pill.active {
      background: var(--xray);
      color: #041019;
      border-color: var(--xray);
    }

    /* CARDS STREAM : JUST REGION TITLE + ORIGINAL IMAGE WITH THE DOT */
    .cards-stream {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .abord-card {
      background: var(--bg-panel);
      border: 2px solid var(--ink);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    html.negatoscope .abord-card {
      border-color: var(--line);
    }

    .abord-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: var(--bg-panel);
      border-bottom: 1.5px solid var(--line);
      cursor: pointer;
    }

    .abord-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16.5px;
      font-weight: 800;
      margin: 0;
      line-height: 1.2;
      color: var(--ink);
    }

    .abord-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .abord-region-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--xray);
      background: var(--xray-soft);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .abord-pdf-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      padding: 4px 9px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .abord-pdf-pages {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px;
      background: var(--bg-panel);
      border-top: 1.5px solid var(--line);
    }

    .abord-page-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      background: var(--bg-elevated);
      border: 1.5px solid var(--line);
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      box-shadow: var(--shadow-key);
    }
    .abord-page-pill:active,
    .abord-pdf-btn:active {
      transform: translateY(1px);
    }

    /* ORIGINAL BOOK IMAGE CROP (UNMODIFIED) */
    .abord-images-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #ffffff;
    }

    .abord-crop-viewport {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #ffffff;
      cursor: zoom-in;
      aspect-ratio: calc(0.92 / ((var(--y2) - var(--y1)) * 1.4995));
    }

    .abord-crop-viewport img {
      width: 108.7%;
      max-width: none;
      margin-left: -4.35%;
      transform: translateY(calc(-100% * var(--y1)));
      display: block;
      pointer-events: none;
    }

    /* FULLSCREEN ZOOM LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4, 7, 11, 0.96);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 12px);
    }
    .lightbox.open {
      display: flex;
    }

    .lb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 6px;
      color: #ECF3F9;
    }

    .lb-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #ECF3F9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #2A3C52;
      background: #FF4D2D;
      border-color: #FF4D2D;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .lb-nav-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #2A3C52;
      background: #16202E;
      color: #ECF3F9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lb-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .lb-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 6px 2px;
      color: #ECF3F9;
    }

    .lb-page-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: #B2C3D4;
      min-width: 90px;
      text-align: center;
    }

    .lb-stage {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      background: #fff;
    }
  </style>
</head>

      <button type="button" class="lb-nav-btn" id="lbNextBtn" onclick="stepLightboxPage(1)">Suiv. ▶</button>

  </div>

      { id: "all", label: "TOUT" },

    const APP_VERSION = "2026-11-04.6";
    function checkForNewVersion() {
      fetch(`version.json?ts=${Date.now()}`, { cache: "no-store" })
        .then(r => (r.ok ? r.json() : null))
        .then(j => {
          if (!j || !j.version || j.version === APP_VERSION) return;
          const u = new URL(location.href);
          if (u.searchParams.get("v") === j.version) return;
          u.searchParams.set("v", j.version);
          location.replace(u.toString());
        })
        .catch(() => {});
    }
    checkForNewVersion();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") checkForNewVersion();
    });

    const THEME_STORAGE_KEY = "cochin_os_theme_v1";
    let activeCat = "all";
    let searchQuery = "";
    let currentLightboxItem = null;
    let currentLightboxPage = 1;

    (function setupBackLink() {
      const link = document.getElementById("cochinBackLink");
      if (window.location.pathname.includes("/guide-interne-cochin-os/")) {
        link.setAttribute("href", "../index.html");
      }
    })();

    function applyTheme(mode) {
      const isDark = mode === "negatoscope";
      document.documentElement.classList.toggle("negatoscope", isDark);
      const label = document.getElementById("themeLabel");
      if (label) label.textContent = isDark ? "PAPIER RADIO" : "NÉGATOSCOPE";
      const meta = document.getElementById("metaThemeColor");
      if (meta) meta.setAttribute("content", isDark ? "#070B10" : "#F2EFE9");
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("negatoscope");
      const next = isDark ? "papier" : "negatoscope";
      try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch (e) {}
      applyTheme(next);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeStr(str) {
      return String(str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function renderCategories() {
      const strip = document.getElementById("catStrip");
      strip.innerHTML = CATEGORIES.map(c => `
        <button type="button" class="cat-pill ${c.id === activeCat ? 'active' : ''}" onclick="selectCat('${c.id}')">
          ${escapeHtml(c.label)}
        </button>
      `).join("");
    }

    function selectCat(catId) {
      activeCat = catId;
      renderCategories();
      renderStream();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      searchQuery = "";
      document.getElementById("searchClear").classList.remove("visible");
      renderStream();
    }

    function renderStream() {
      const stream = document.getElementById("cardsStream");
      const normQ = normalizeStr(searchQuery.trim());

      const filtered = ITEMS.filter(it => {
        if (activeCat !== "all" && it.category !== activeCat) return false;
        if (!normQ) return true;
        return normalizeStr(`${it.title} ${it.subregion}`).includes(normQ);
      });

      stream.innerHTML = filtered.map(it => {
        const defaultPage = (it.abordCrops[0] && it.abordCrops[0].pdfPage) || it.pdfPages[0];
        return `
        <article class="abord-card">
          <div class="abord-header" onclick="openItemPdf('${it.id}', ${defaultPage})">
            <h2 class="abord-title">${escapeHtml(it.title)}</h2>
            <div class="abord-header-right">
              <span class="abord-region-tag">${escapeHtml(it.subregion)}</span>
              <button type="button" class="abord-pdf-btn" onclick="event.stopPropagation(); openItemPdf('${it.id}', ${defaultPage})">
                📄 PDF
              </button>
            </div>
          </div>
          <div class="abord-images-list">
            ${it.abordCrops.map(c => `
              <div class="abord-crop-viewport" style="--y1:${c.y1}; --y2:${c.y2};" onclick="openItemPdf('${it.id}', ${c.pdfPage})">
                <img src="${c.image}" loading="lazy" alt="${escapeHtml(it.title)}" />
              </div>
            `).join("")}
          </div>
          <div class="abord-pdf-pages">
            ${it.pdfPages.map(p => `
              <button type="button" class="abord-page-pill" onclick="openItemPdf('${it.id}', ${p})">
                🔍 Planche p.${p}
              </button>
            `).join("")}
          </div>
        </article>
      `}).join("");
    }

    function openItemPdf(itemId, pdfPage) {
      const item = ITEMS.find(x => x.id === itemId) || null;
      currentLightboxItem = item;
      currentLightboxPage = pdfPage || (item && item.pdfPages[0]) || 1;
      updateLightbox();
      document.getElementById("lightbox").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function openZoom(imgSrc, title) {
      const m = String(imgSrc).match(/page_(\d+)\.jpg/);
      const pageNum = m ? parseInt(m[1], 10) : 1;
      const item = ITEMS.find(x => x.title === title || x.pdfPages.includes(pageNum)) || null;
      currentLightboxItem = item;
      currentLightboxPage = pageNum;
      updateLightbox(imgSrc, title);
      document.getElementById("lightbox").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function updateLightbox(overrideSrc, overrideTitle) {
      const padded = String(currentLightboxPage).padStart(3, "0");
      document.getElementById("lbImage").src = overrideSrc || `pages/page_${padded}.jpg`;
      const titleText = overrideTitle || (currentLightboxItem ? currentLightboxItem.title : `Planche ${currentLightboxPage}`);
      document.getElementById("lbTitle").textContent = titleText;

      const pages = (currentLightboxItem && currentLightboxItem.pdfPages && currentLightboxItem.pdfPages.length > 0)
        ? currentLightboxItem.pdfPages
        : [currentLightboxPage];
      const idx = pages.indexOf(currentLightboxPage);
      const indicator = document.getElementById("lbPageIndicator");
      const prevBtn = document.getElementById("lbPrevBtn");
      const nextBtn = document.getElementById("lbNextBtn");

      if (pages.length > 1 && idx !== -1) {
        indicator.textContent = `P. ${currentLightboxPage} (${idx + 1}/${pages.length})`;
        prevBtn.disabled = idx <= 0;
        nextBtn.disabled = idx >= pages.length - 1;
      } else {
        indicator.textContent = `P. ${currentLightboxPage} / 213`;
        prevBtn.disabled = currentLightboxPage <= 1;
        nextBtn.disabled = currentLightboxPage >= 213;
      }
    }

    function stepLightboxPage(delta) {
      if (currentLightboxItem && currentLightboxItem.pdfPages && currentLightboxItem.pdfPages.length > 1) {
        const pages = currentLightboxItem.pdfPages;
        const idx = pages.indexOf(currentLightboxPage);
        if (idx !== -1) {
          const nextIdx = idx + delta;
          if (nextIdx >= 0 && nextIdx < pages.length) {
            currentLightboxPage = pages[nextIdx];
            updateLightbox();
          }
          return;
        }
      }
      currentLightboxPage = Math.max(1, Math.min(213, currentLightboxPage + delta));
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
      document.body.style.overflow = "";
    }

    window.addEventListener("keydown", (e) => {
      if (!document.getElementById("lightbox").classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") stepLightboxPage(-1);
      else if (e.key === "ArrowRight") stepLightboxPage(1);
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      document.getElementById("searchClear").classList.toggle("visible", searchQuery.length > 0);
      renderStream();
    });

    (function init() {
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme) applyTheme(savedTheme);
      } catch (e) {}
      renderCategories();
      renderStream();
    })();
  </script>
</body>
</html>
