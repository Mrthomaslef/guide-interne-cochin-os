<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EFE9" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Annuaire Cochin" />
  <title>Annuaire Cochin — Radio B &amp; Services</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F2EFE9;
      --bg-panel: #FAF8F4;
      --bg-well: #E6E1D6;
      --ink: #11151C;
      --ink-soft: #4A5260;
      --ink-muted: #7C8492;
      --line: #D4CEC2;
      --line-strong: #11151C;
      --accent: #FF4D2D;
      --accent-soft: rgba(255, 77, 45, 0.12);
      --xray: #0284C7;
      --xray-soft: rgba(2, 132, 199, 0.11);
      --call-bg: #11151C;
      --call-fg: #FAF8F4;
      --shadow-key: 0 2px 0 #C7C0B2;
      --radius: 12px;
    }

    html.negatoscope {
      --bg: #080C11;
      --bg-panel: #101720;
      --bg-well: #16202C;
      --ink: #ECF3F9;
      --ink-soft: #94A8BE;
      --ink-muted: #5B7088;
      --line: #1E2C3A;
      --line-strong: #38BDF8;
      --accent: #FF5A36;
      --accent-soft: rgba(255, 90, 54, 0.16);
      --xray: #38BDF8;
      --xray-soft: rgba(56, 189, 248, 0.14);
      --call-bg: #38BDF8;
      --call-fg: #061018;
      --shadow-key: 0 2px 0 #040609;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    /* Subtle technical grid background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.55;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 36px);
    }

    /* Top instrument bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-panel);
      border: 1.5px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow-key);
      transition: transform 0.1s ease, border-color 0.15s ease;
    }
    .back-btn:active {
      transform: translateY(1px);
    }
    .back-btn:hover {
      border-color: var(--ink);
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.03em;
    }
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 35px;
      padding: 0 11px;
      background: var(--bg-panel);
      border: 1.5px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-key);
    }
    .icon-btn:hover {
      border-color: var(--ink);
    }

    /* Search & Smart 1XXXX Dialer Box */
    .search-console {
      background: var(--bg-panel);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      margin-bottom: 10px;
    }
    html.negatoscope .search-console {
      border-color: var(--xray);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.08);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-prefix {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      padding: 4px 7px;
      background: var(--accent-soft);
      border-radius: 6px;
      user-select: none;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }
    .search-input::placeholder {
      color: var(--ink-muted);
      font-weight: 500;
    }

    .clear-btn {
      border: none;
      background: var(--bg-well);
      color: var(--ink-soft);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    /* Smart 5-digit converter banner */
    .smart-dialer {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .smart-dialer.visible {
      display: flex;
    }
    .smart-dialer-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .smart-dialer-info strong {
      color: var(--ink);
    }
    .smart-call-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    /* Filter Tabs */
    .filter-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--bg-panel);
      color: var(--ink-soft);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-key);
      transition: all 0.12s ease;
    }
    .tab-pill.active {
      background: var(--ink);
      color: var(--bg-panel);
      border-color: var(--ink);
    }
    html.negatoscope .tab-pill.active {
      background: var(--xray);
      color: #041019;
      border-color: var(--xray);
    }

    /* Rule reminder strip */
    .rule-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-muted);
      padding: 0 4px 8px;
    }

    /* Group sections */
    .group-block {
      margin-bottom: 14px;
    }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      padding: 6px 4px;
      border-bottom: 1.5px solid var(--line);
      margin-bottom: 6px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-panel);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow-key);
      transition: border-color 0.12s ease;
    }
    .contact-row:hover {
      border-color: var(--ink-soft);
    }

    .contact-left {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .fav-btn {
      border: none;
      background: transparent;
      color: var(--line);
      font-size: 16px;
      line-height: 1;
      padding: 2px 0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .fav-btn.active {
      color: var(--accent);
    }

    .contact-meta {
      min-width: 0;
      flex: 1;
    }

    .contact-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      color: var(--ink);
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bldg-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--bg-well);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .contact-role {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
      line-height: 1.3;
    }

    .contact-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .poste-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--xray);
      background: var(--xray-soft);
      border: 1px solid rgba(2, 132, 199, 0.28);
      padding: 6px 9px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .poste-badge:active {
      transform: scale(0.97);
    }

    .call-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      background: var(--call-bg);
      color: var(--call-fg);
      padding: 7px 10px;
      border-radius: 7px;
      text-decoration: none;
      white-space: nowrap;
    }
    .call-btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 560px) {
      .contact-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .contact-actions {
        justify-content: flex-end;
        padding-left: 24px;
      }
    }

    /* Simple Modal for adding custom number */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 17, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-panel);
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 16px;
    }
    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 16px;
      margin: 0 0 12px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
    }
    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg-panel);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      display: none;
      z-index: 90;
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top bar -->
    <header class="topbar">
      <a href="../index.html" class="back-btn" title="Retour au hub Cochin OS">
        <span>←</span>
        <span>COCHIN·OS</span>
      </a>
      <div class="brand-title">
        <span>ANNUAIRE</span>
        <span class="brand-tag">RADIO B</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="openAddModal()" title="Ajouter un numéro">+ N°</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Mode Négatoscope / Papier">◐</button>
      </div>
    </header>

    <!-- Search & 5-digit Dialer -->
    <section class="search-console">
      <div class="search-row">
        <span class="search-prefix">POSTE / NOM</span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Ex: 12483, RI, Salle, Orthopédie, Feydy, Sellami..."
          autocomplete="off"
          oninput="onSearchInput(this.value)"
        />
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()">ESC</button>
      </div>
      <div class="smart-dialer" id="smartDialer"></div>
    </section>

    <!-- Category filter pills -->
    <nav class="filter-strip" id="filterStrip">
      <button class="tab-pill active" data-cat="all" onclick="setCat('all')">TOUS</button>
      <button class="tab-pill" data-cat="fav" onclick="setCat('fav')">★ FAVORIS</button>
      <button class="tab-pill" data-cat="Radiologie B — Secrétariats & Consoles" onclick="setCat('Radiologie B — Secrétariats & Consoles')">CONSOLES &amp; RI</button>
      <button class="tab-pill" data-cat="Radiologie B — Équipe Médicale (Chefs & Seniors)" onclick="setCat('Radiologie B — Équipe Médicale (Chefs & Seniors)')">CHEFS &amp; SENIORS</button>
      <button class="tab-pill" data-cat="Services Partenaires (Ortho, Rhumato, Anesth, Anapath)" onclick="setCat('Services Partenaires (Ortho, Rhumato, Anesth, Anapath)')">SERVICES (ORTHO/RHUMATO)</button>
      <button class="tab-pill" data-cat="Laboratoires, Pharmacie & Administration (DAM)" onclick="setCat('Laboratoires, Pharmacie & Administration (DAM)')">LABOS &amp; ADMIN</button>
    </nav>

    <div class="rule-bar">
      <span>RÈGLE COCHIN : POSTE 1XXYY = 01 58 41 XX YY</span>
      <span id="countLabel">44 CONTACTS</span>
    </div>

    <!-- Directory Content -->
    <main id="directoryContainer"></main>
  </div>

  <!-- Add custom number modal -->
  <div class="modal-backdrop" id="addModal" onclick="if(event.target===this)closeAddModal()">
    <div class="modal-card">
      <h2 class="modal-title">Ajouter un numéro (Annuaire Cochin)</h2>
      <div class="field">
        <label>Catégorie</label>
        <select id="addCat">
          <option value="Radiologie B — Secrétariats & Consoles">Radiologie B — Secrétariats &amp; Consoles</option>
          <option value="Radiologie B — Équipe Médicale (Chefs & Seniors)">Radiologie B — Équipe Médicale (Chefs &amp; Seniors)</option>
          <option value="Services Partenaires (Ortho, Rhumato, Anesth, Anapath)">Services Partenaires (Ortho, Rhumato, Anesth, Anapath)</option>
          <option value="Laboratoires, Pharmacie & Administration (DAM)">Laboratoires, Pharmacie &amp; Administration (DAM)</option>
        </select>
      </div>
      <div class="field">
        <label>Nom / Salle / Service</label>
        <input type="text" id="addName" placeholder="Ex: Console IRM 3T / Garde..." />
      </div>
      <div class="field">
        <label>Fonction / Détail</label>
        <input type="text" id="addRole" placeholder="Ex: Bâtiment Ollier -1" />
      </div>
      <div class="field">
        <label>Poste 5 chiffres ou DECT (ex: 12488)</label>
        <input type="text" id="addPoste" placeholder="12488" oninput="autoFillPhoneFromPoste(this.value)" />
      </div>
      <div class="field">
        <label>Ligne directe (01 58 41 XX XX)</label>
        <input type="text" id="addPhone" placeholder="01 58 41 24 88" />
      </div>
      <div class="field">
        <label>Bâtiment</label>
        <input type="text" id="addBldg" placeholder="Bâtiment Ollier" />
      </div>
      <div class="modal-btns">
        <button class="icon-btn" onclick="closeAddModal()">Annuler</button>
        <button class="icon-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);" onclick="saveCustomContact()">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

      { id: "tel-standard", category: "Laboratoires, Pharmacie & Administration (DAM)", name: "Standard Général Hôpital Cochin", role: "Standard AP-HP Cochin (27 rue du Faubourg Saint-Jacques)", poste: "11000 / 9", phone: "01 58 41 10 00", building: "Hôpital Cochin" }

    const CATEGORIES = [
      "Radiologie B — Secrétariats & Consoles",
      "Radiologie B — Équipe Médicale (Chefs & Seniors)",
      "Services Partenaires (Ortho, Rhumato, Anesth, Anapath)",
      "Laboratoires, Pharmacie & Administration (DAM)"
    ];

    const FAV_STORAGE_KEY = "cochin_os_annuaire_favs_v1";
    const CUSTOM_STORAGE_KEY = "cochin_os_annuaire_custom_v1";
    const THEME_STORAGE_KEY = "cochin_os_theme_v1";

    let contacts = FALLBACK_CONTACTS.slice();
    let currentCat = "all";
    let searchQuery = "";
    let favIds = loadFavIds();

    function loadFavIds() {
      try {
        const raw = localStorage.getItem(FAV_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return FALLBACK_CONTACTS.filter(c => c.pinnedDefault).map(c => c.id);
    }

    function saveFavIds() {
      try {
        localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favIds));
      } catch (e) {}
    }

    function loadCustomContacts() {
      try {
        const raw = localStorage.getItem(CUSTOM_STORAGE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return [];
    }

    function mergeContacts(list) {
      const map = new Map();
      loadCustomContacts().forEach(c => { if (c && c.id) map.set(c.id, c); });
      contacts.forEach(c => { if (c && c.id && !map.has(c.id)) map.set(c.id, c); });
      (list || []).forEach(c => {
        if (c && c.id) {
          const existing = map.get(c.id) || {};
          map.set(c.id, Object.assign({}, existing, c));
        }
      });
      contacts = Array.from(map.values());
    }

    function toggleFav(id) {
      const idx = favIds.indexOf(id);
      if (idx >= 0) favIds.splice(idx, 1);
      else favIds.push(id);
      saveFavIds();
      renderDirectory();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function convertPosteToDirect(q) {
      const digits = String(q || "").replace(/\D/g, "");
      if (/^1\d{4}$/.test(digits)) {
        const a = digits.slice(1, 3);
        const b = digits.slice(3, 5);
        return {
          poste: digits,
          formatted: `01 58 41 ${a} ${b}`,
          telHref: `015841${a}${b}`
        };
      }
      return null;
    }

    function renderSmartDialer() {
      const box = document.getElementById("smartDialer");
      const converted = convertPosteToDirect(searchQuery);
      if (!converted) {
        box.classList.remove("visible");
        box.innerHTML = "";
        return;
      }
      box.classList.add("visible");
      box.innerHTML = `
        <div class="smart-dialer-info">
          POSTE INTERNE <strong>${converted.poste}</strong> → LIGNE DIRECTE <strong>${converted.formatted}</strong>
        </div>
        <a href="tel:${converted.telHref}" class="smart-call-btn">
          <span>☎ APPELER ${converted.formatted}</span>
        </a>
      `;
    }

    function copyPoste(text) {
      if (navigator.clipboard && text) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      showToast(`Copié : ${text}`);
    }

    function renderContactRow(c) {
      const isFav = favIds.includes(c.id);
      const telClean = String(c.phone || "").replace(/[^0-9+]/g, "");
      return `
        <div class="contact-row">
          <div class="contact-left">
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${escapeHtml(c.id)}')" title="Épingler en favori">★</button>
            <div class="contact-meta">
              <div class="contact-name">
                <span>${escapeHtml(c.name)}</span>
                ${c.building ? `<span class="bldg-tag">${escapeHtml(c.building)}</span>` : ""}
              </div>
              <div class="contact-role">${escapeHtml(c.role || "")}</div>
            </div>
          </div>
          <div class="contact-actions">
            ${c.poste ? `<button class="poste-badge" onclick="copyPoste('${escapeHtml(c.poste)}')" title="Copier le poste">${escapeHtml(c.poste)}</button>` : ""}
            ${c.phone ? `<a href="tel:${telClean}" class="call-btn">☎ ${escapeHtml(c.phone)}</a>` : ""}
          </div>
        </div>
      `;
    }

    function renderDirectory() {
      renderSmartDialer();
      const q = searchQuery.toLowerCase().trim();
      const clearBtn = document.getElementById("clearBtn");
      clearBtn.style.display = q ? "inline-block" : "none";

      const filtered = contacts.filter(c => {
        if (currentCat === "fav" && !favIds.includes(c.id)) return false;
        if (currentCat !== "all" && currentCat !== "fav" && c.category !== currentCat) return false;
        if (!q) return true;
        const hay = `${c.name || ""} ${c.role || ""} ${c.poste || ""} ${c.phone || ""} ${c.building || ""} ${c.category || ""}`.toLowerCase();
        const hayDigits = hay.replace(/\s+/g, "");
        const qDigits = q.replace(/\s+/g, "");
        return hay.includes(q) || hayDigits.includes(qDigits);
      });

      document.getElementById("countLabel").textContent = `${filtered.length} CONTACT${filtered.length > 1 ? "S" : ""}`;

      const container = document.getElementById("directoryContainer");
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="contact-row" style="justify-content:center;padding:24px;color:var(--ink-muted);font-family:'JetBrains Mono',monospace;font-size:12px;">
            AUCUN CONTACT TROUVÉ — TAPEZ UN POSTE À 5 CHIFFRES (EX: 12483) POUR COMPOSER DIRECTEMENT
          </div>
        `;
        return;
      }

      let html = "";

      // Show pinned favorites at top when viewing "all" without search filter
      if (currentCat === "all" && !q) {
        const favItems = filtered.filter(c => favIds.includes(c.id));
        if (favItems.length > 0) {
          html += `
            <section class="group-block">
              <div class="group-header">
                <span>★ ACCÈS RAPIDE / FAVORIS RADIO B</span>
                <span>${favItems.length}</span>
              </div>
              <div class="contact-list">
                ${favItems.map(renderContactRow).join("")}
              </div>
            </section>
          `;
        }
      }

      if (currentCat === "fav") {
        html += `
          <section class="group-block">
            <div class="group-header">
              <span>★ FAVORIS ÉPINGLÉS</span>
              <span>${filtered.length}</span>
            </div>
            <div class="contact-list">
              ${filtered.map(renderContactRow).join("")}
            </div>
          </section>
        `;
      } else {
        CATEGORIES.forEach(cat => {
          const items = filtered.filter(c => c.category === cat);
          if (!items.length) return;
          html += `
            <section class="group-block">
              <div class="group-header">
                <span>${escapeHtml(cat)}</span>
                <span>${items.length}</span>
              </div>
              <div class="contact-list">
                ${items.map(renderContactRow).join("")}
              </div>
            </section>
          `;
        });
      }

      container.innerHTML = html;
    }

    function onSearchInput(val) {
      searchQuery = val;
      renderDirectory();
    }

    function clearSearch() {
      searchQuery = "";
      const inp = document.getElementById("searchInput");
      inp.value = "";
      renderDirectory();
      inp.focus();
    }

    function setCat(cat) {
      currentCat = cat;
      document.querySelectorAll(".tab-pill").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-cat") === cat);
      });
      renderDirectory();
    }

    function openAddModal() {
      document.getElementById("addName").value = "";
      document.getElementById("addRole").value = "";
      document.getElementById("addPoste").value = "";
      document.getElementById("addPhone").value = "01 58 41 ";
      document.getElementById("addBldg").value = "Bâtiment Ollier";
      document.getElementById("addModal").classList.add("open");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("open");
    }

    function autoFillPhoneFromPoste(val) {
      const conv = convertPosteToDirect(val);
      if (conv) {
        document.getElementById("addPhone").value = conv.formatted;
      }
    }

    function saveCustomContact() {
      const category = document.getElementById("addCat").value;
      const name = document.getElementById("addName").value.trim();
      const role = document.getElementById("addRole").value.trim();
      const poste = document.getElementById("addPoste").value.trim();
      const phone = document.getElementById("addPhone").value.trim();
      const building = document.getElementById("addBldg").value.trim() || "Hôpital Cochin";

      if (!name || (!poste && !phone)) {
        showToast("Indiquez un nom et un numéro");
        return;
      }

      const item = {
        id: "tel-custom-" + Date.now(),
        category,
        name,
        role,
        poste,
        phone,
        building
      };

      const custom = loadCustomContacts();
      custom.unshift(item);
      try {
        localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(custom));
      } catch (e) {}

      contacts.unshift(item);
      favIds.unshift(item.id);
      saveFavIds();
      closeAddModal();
      renderDirectory();
      showToast("Numéro ajouté aux favoris");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function applyTheme(mode) {
      const isDark = mode === "negatoscope";
      document.documentElement.classList.toggle("negatoscope", isDark);
      const meta = document.getElementById("metaThemeColor");
      if (meta) meta.setAttribute("content", isDark ? "#080C11" : "#F2EFE9");
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("negatoscope");
      const next = isDark ? "papier" : "negatoscope";
      try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch (e) {}
      applyTheme(next);
    }

    // Init theme & URL params
    (function init() {
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme) applyTheme(savedTheme);
      } catch (e) {}

      mergeContacts(FALLBACK_CONTACTS);

      const params = new URLSearchParams(window.location.search);
      const qParam = params.get("q");
      if (qParam) {
        searchQuery = qParam;
        const inp = document.getElementById("searchInput");
        if (inp) inp.value = qParam;
      }

      renderDirectory();

      // Load local JSON + live sync from agenda-internes
      fetch("./annuaire-data.json")
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (Array.isArray(data)) {
            mergeContacts(data);
            renderDirectory();
          }
        })
        .catch(() => {});

      fetch("https://mrthomaslef.github.io/agenda-internes/internes_data.json")
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data && Array.isArray(data.phoneDirectory)) {
            mergeContacts(data.phoneDirectory);
            renderDirectory();
          }
        })
        .catch(() => {});
    })();

    // Défilement horizontal fluide à la molette ou au trackpad sur les onglets de catégories
    (function initDesktopWheelScroll() {
      window.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) return;
        const dy = e.deltaY || 0;
        const dx = e.deltaX || 0;
        if (!dy && !dx) return;
        const horiz = e.target && e.target.closest ? e.target.closest(".cat-tabs, #catTabs") : null;
        if (horiz && horiz.scrollWidth > horiz.clientWidth && Math.abs(dy) > Math.abs(dx)) {
          horiz.scrollLeft += dy;
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
